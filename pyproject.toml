[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-scanner"
version = "1.0.0"
description = "Ознакомительный сканер публичных Steam-инвентарей с GUI и CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["steam", "inventory", "tkinter", "cs2", "dota2", "rust", "tf2"]
dependencies = ["requests[socks]>=2.32,<3"]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[project.scripts]
inventory-scanner = "inventory_scanner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]


[tool.setuptools.package-data]
inventory_scanner = ["resources/*.json"]
